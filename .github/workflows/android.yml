name: Build FraudGuard Debug APK

on:
  push:
    branches:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-debug:

    name: Build FraudGuard Debug APK

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 1. Checkout project
      # ------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v5


      # ------------------------------------------------------
      # 2. Install Java 17
      # ------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ------------------------------------------------------
      # 3. Install Python 3.13
      #    Required by the embedded Python/Chaquopy build.
      # ------------------------------------------------------
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"


      # ------------------------------------------------------
      # 4. Download Gradle 9.4.1
      #
      # IMPORTANT:
      # At this point the repository does NOT need to contain
      # gradlew.
      #
      # GitHub Actions installs Gradle first.
      # ------------------------------------------------------
      - name: Install Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic


      # ------------------------------------------------------
      # 5. Verify the downloaded Gradle
      # ------------------------------------------------------
      - name: Check installed Gradle
        run: |
          gradle --version


      # ------------------------------------------------------
      # 6. CREATE GRADLE WRAPPER
      #
      # This generates:
      #
      # gradlew
      # gradlew.bat
      # gradle/wrapper/gradle-wrapper.jar
      # gradle/wrapper/gradle-wrapper.properties
      #
      # The wrapper will use Gradle 9.4.1.
      # ------------------------------------------------------
      - name: Create Gradle Wrapper
        run: |
          gradle wrapper \
            --gradle-version 9.4.1 \
            --distribution-type bin


      # ------------------------------------------------------
      # 7. Make Linux Gradle wrapper executable
      # ------------------------------------------------------
      - name: Make gradlew executable
        run: |
          chmod +x gradlew


      # ------------------------------------------------------
      # 8. Verify generated Gradle wrapper
      # ------------------------------------------------------
      - name: Verify Gradle Wrapper
        run: |
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Gradle wrapper files:"
          ls -lh gradlew
          ls -lh gradlew.bat
          ls -lh gradle/wrapper/


      # ------------------------------------------------------
      # 9. Verify the wrapper itself
      #
      # IMPORTANT:
      # From this point onward we use ./gradlew,
      # NOT the globally installed "gradle".
      # ------------------------------------------------------
      - name: Verify Gradle Wrapper
        run: |
          ./gradlew --version


      # ------------------------------------------------------
      # 10. Build DEBUG APK
      #
      # No release signing.
      # No Play Store publishing.
      # ------------------------------------------------------
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace


      # ------------------------------------------------------
      # 11. Verify APK
      # ------------------------------------------------------
      - name: Verify Debug APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "Debug APK successfully created:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk


      # ------------------------------------------------------
      # 12. Upload APK as GitHub Actions artifact
      # ------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FraudGuard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      # ------------------------------------------------------
      # 13. Upload generated Gradle wrapper
      #
      # This is OPTIONAL but useful.
      #
      # It lets you download the generated wrapper from
      # the GitHub Actions run and put it into the repository
      # later if you want.
      # ------------------------------------------------------
      - name: Upload Generated Gradle Wrapper
        uses: actions/upload-artifact@v4
        with:
          name: FraudGuard-gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
